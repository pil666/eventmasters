<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redes Sociales</title>
    <link rel="stylesheet" href="/redes.css">
</head>
<body>
    <div class="wrapper">
        <div class="banner">
            <img src="logo.png" alt="Logo" class="logo">
            <h2 class="wel_text">¡Bienvenido!</h2>
            <p class="para">Síguenos en nuestras redes sociales.</p>
        </div>
        <div class="from">
            <h2 class="title">Contáctanos</h2>
            <ul class="social-links">
                <li><a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="link">Facebook</a></li>
                <li><a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="link">Instagram</a></li>
                <li><a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="link">YouTube</a></li>
            </ul>
            <div class="inp">
                <input type="email" placeholder="Tu correo" class="input" required>
            </div>
            <button class="submit">Enviar</button>
        </div>
    </div>
    <div class="footer">
        <p>© 2024 Tu Empresa. Todos los derechos reservados.</p>
    </div>
</body>
</html>
