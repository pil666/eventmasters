<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Evento</title>
    <link rel="stylesheet" href="actualizarevento.css">
</head>
<body>

<div class="container">
    <h1>Actualizar Evento</h1>
    <form id="updateEventForm">
        <div class="form-group">
            <label for="eventId">ID del Evento:</label>
            <input type="text" id="eventId" required>
        </div>
        <div class="form-group">
            <label for="eventName">Nuevo Nombre:</label>
            <input type="text" id="eventName" required>
        </div>
        <div class="form-group">
            <label for="eventDate">Nueva Fecha:</label>
            <input type="date" id="eventDate" required>
        </div>
        <div class="form-group">
            <label for="eventTime">Nueva Hora:</label>
            <input type="time" id="eventTime" required>
        </div>
        <div class="form-group">
            <label for="eventDescription">Nueva Descripción:</label>
            <textarea id="eventDescription" rows="4" required></textarea>
        </div>
        <button type="submit">Actualizar Evento</button>
    </form>
    <div class="message" id="message"></div>
    <a href="../eventos/eventos.html" class="back-button">Regresar</a>
</div>

<script>
    document.getElementById('updateEventForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const eventId = document.getElementById('eventId').value;
        const eventName = document.getElementById('eventName').value;
        const eventDate = document.getElementById('eventDate').value;
        const eventTime = document.getElementById('eventTime').value;
        const eventDescription = document.getElementById('eventDescription').value;

        // Simulación de actualización (en un proyecto real, aquí iría la lógica de backend)
        const messageElement = document.getElementById('message');
        messageElement.textContent = `Evento con ID: ${eventId} actualizado con éxito.`;
        messageElement.style.opacity = 1;
        messageElement.style.color = '#d4af37'; // Dorado

        // Limpiar formulario
        document.getElementById('updateEventForm').reset();
    });
</script>

</body>
</html>
